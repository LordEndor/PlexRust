name: Release

# Every merge to main publishes a signed build. Installed copies of the app
# find it through latest.json and offer to update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Fetch mpv for Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { $rel.assets.name; throw "No mpv build found in $($rel.tag_name)" }
          Write-Host "Bundling $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -osrc-tauri/mpv -y | Out-Null
          Remove-Item src-tauri/mpv/installer, src-tauri/mpv/doc, src-tauri/mpv/mpv.com -Recurse -ErrorAction SilentlyContinue
          if (-not (Test-Path src-tauri/mpv/mpv.exe)) { throw "mpv.exe missing after extract" }
          Get-ChildItem src-tauri/mpv

      - name: Stamp version
        shell: bash
        run: |
          VERSION="0.1.${{ github.run_number }}"
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='$VERSION';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          echo "Building $VERSION"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: PlexRust v__VERSION__
          releaseBody: Built from ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
