[workspace]
resolver = "3"
members = ["src-tauri", "crates/plex"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "gzip", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros"] }
uuid = { version = "1", features = ["v4"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
